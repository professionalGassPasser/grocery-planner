<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Grocery Planner</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 15px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .header p {
            font-size: 13px;
            opacity: 0.9;
        }
        
        .tabs {
            display: flex;
            border-bottom: 2px solid #e0e0e0;
            overflow-x: auto;
            background: #f9f9f9;
        }
        
        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
            white-space: nowrap;
            min-width: 100px;
        }
        
        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }
        
        .tab-btn:hover {
            color: #667eea;
        }
        
        .content {
            padding: 20px;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .filter-section {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }
        
        .filter-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        
        .filter-btn:hover {
            border-color: #667eea;
        }
        
        .add-item-form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .add-item-form input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        
        .add-item-form input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.1);
        }
        
        .add-item-form select {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            background: white;
        }
        
        .add-item-form button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.3s;
        }
        
        .add-item-form button:hover {
            background: #764ba2;
        }
        
        .shopping-section {
            margin-bottom: 25px;
        }
        
        .section-title {
            font-size: 15px;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 2px solid #667eea;
        }
        
        .shopping-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
            transition: background 0.2s;
        }
        
        .shopping-item:hover {
            background: #f9f9f9;
        }
        
        .shopping-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            margin-right: 12px;
            accent-color: #667eea;
        }
        
        .shopping-item label {
            flex: 1;
            cursor: pointer;
            font-size: 14px;
            color: #333;
        }
        
        .shopping-item.checked label {
            text-decoration: line-through;
            color: #999;
        }
        
        .shopping-item .delete-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.3s;
        }
        
        .shopping-item .delete-btn:hover {
            background: #ee5a52;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }
        
        .empty-state p {
            font-size: 14px;
        }
        
        .meal-day {
            margin-bottom: 20px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        
        .meal-day h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 15px;
        }
        
        .meal-type {
            margin-bottom: 8px;
            font-size: 13px;
        }
        
        .meal-type strong {
            color: #666;
            display: inline-block;
            width: 70px;
        }
        
        .meal-type p {
            display: inline;
            color: #333;
        }
        
        .recipe-day {
            margin-bottom: 25px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 8px;
        }
        
        .recipe-day h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .recipe-content {
            display: none;
            margin-top: 12px;
            font-size: 13px;
            color: #555;
            line-height: 1.6;
        }
        
        .recipe-content.open {
            display: block;
        }
        
        .recipe-day h3:hover {
            opacity: 0.7;
        }
        
        .prep-tips-section {
            margin-bottom: 20px;
            padding: 15px;
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            border-radius: 4px;
        }
        
        .prep-tips-section h3 {
            color: #667eea;
            font-size: 14px;
            margin-bottom: 8px;
        }
        
        .prep-tips-section p {
            font-size: 13px;
            color: #555;
            margin-bottom: 4px;
            padding-left: 15px;
        }
        
        .stats {
            padding: 15px;
            background: #f0f4ff;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #667eea;
            font-weight: 500;
        }
        
        @media (max-width: 600px) {
            .header h1 {
                font-size: 20px;
            }
            
            .add-item-form {
                flex-direction: column;
            }
            
            .tab-btn {
                font-size: 12px;
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛒 Weekly Grocery Planner</h1>
            <p>Wheat-free • Family-friendly • Blackstone-ready</p>
        </div>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('shopping')">Shopping List</button>
            <button class="tab-btn" onclick="switchTab('meals')">Meal Plan</button>
            <button class="tab-btn" onclick="switchTab('recipes')">Recipes</button>
            <button class="tab-btn" onclick="switchTab('prep')">Prep Tips</button>
        </div>
        
        <div class="content">
            <!-- SHOPPING LIST TAB -->
            <div id="shopping" class="tab-content active">
                <div class="stats" id="stats"></div>
                
                <div class="add-item-form">
                    <input type="text" id="newItemInput" placeholder="Add new item..." />
                    <select id="sectionSelect">
                        <option value="Produce">Produce</option>
                        <option value="Dairy & Cheese">Dairy & Cheese</option>
                        <option value="Proteins">Proteins</option>
                        <option value="Pantry (GF)">Pantry (GF)</option>
                        <option value="Pantry & Condiments">Pantry & Condiments</option>
                        <option value="Fruit">Fruit</option>
                    </select>
                    <button onclick="addItem()">Add</button>
                </div>
                
                <div class="filter-section">
                    <button class="filter-btn active" onclick="filterSection('all')">All Items</button>
                    <button class="filter-btn" onclick="filterSection('Produce')">Produce</button>
                    <button class="filter-btn" onclick="filterSection('Proteins')">Proteins</button>
                    <button class="filter-btn" onclick="filterSection('Dairy & Cheese')">Dairy</button>
                    <button class="filter-btn" onclick="filterSection('Pantry (GF)')">Pantry</button>
                </div>
                
                <div id="shoppingList"></div>
            </div>
            
            <!-- MEAL PLAN TAB -->
            <div id="meals" class="tab-content">
                <div id="mealPlanContent"></div>
            </div>
            
            <!-- RECIPES TAB -->
            <div id="recipes" class="tab-content">
                <div id="recipesContent"></div>
            </div>
            
            <!-- PREP TIPS TAB -->
            <div id="prep" class="tab-content">
                <div id="prepContent"></div>
            </div>
        </div>
    </div>
    
    <script>
        // Initial shopping data organized by store section
        const initialData = {
            "Proteins": [
                { name: "Chicken thighs (3 lbs)", checked: false },
                { name: "Ground beef (2 lbs)", checked: false },
                { name: "Cod fillets (1.5 lbs)", checked: false },
                { name: "Pork shoulder (4 lbs)", checked: false },
                { name: "Eggs (18 count)", checked: false },
                { name: "Deli turkey", checked: false },
                { name: "Rotisserie chicken", checked: false }
            ],
            "Dairy & Cheese": [
                { name: "Greek yogurt", checked: false },
                { name: "Shredded cheddar", checked: false },
                { name: "Mozzarella cheese", checked: false },
                { name: "Milk", checked: false },
                { name: "Butter", checked: false }
            ],
            "Pantry (GF)": [
                { name: "GF pasta", checked: false },
                { name: "GF bread (wheat-free)", checked: false },
                { name: "Corn tortillas", checked: false },
                { name: "Hard corn tortilla shells", checked: false },
                { name: "Siete tortillas (GF)", checked: false },
                { name: "GF tortillas", checked: false },
                { name: "Long-grain rice", checked: false },
                { name: "Certified GF oats", checked: false },
                { name: "GF pancake mix", checked: false },
                { name: "GF crackers", checked: false }
            ],
            "Produce": [
                { name: "Sweet potatoes (3 lbs)", checked: false },
                { name: "Green beans (2 lbs)", checked: false },
                { name: "Cabbage (1 head)", checked: false },
                { name: "Carrots (2 lbs)", checked: false },
                { name: "Bell peppers (3-4)", checked: false },
                { name: "Onions (3-4)", checked: false },
                { name: "Potatoes (2 lbs)", checked: false },
                { name: "Avocados (3-4)", checked: false },
                { name: "Tomatoes (2-3)", checked: false },
                { name: "Lettuce/spinach", checked: false },
                { name: "Asparagus (1 bunch)", checked: false }
            ],
            "Fruit": [
                { name: "Berries (mixed)", checked: false },
                { name: "Bananas (6-8)", checked: false },
                { name: "Apples (4-5)", checked: false }
            ],
            "Pantry & Condiments": [
                { name: "Olive oil", checked: false },
                { name: "Tomato sauce/marinara (wheat-free)", checked: false },
                { name: "Soy sauce (wheat-free tamari)", checked: false },
                { name: "Lime juice", checked: false },
                { name: "Garlic", checked: false },
                { name: "Ginger", checked: false },
                { name: "Spices: cumin, paprika, salt, pepper", checked: false }
            ]
        };
        
        let shoppingData = JSON.parse(localStorage.getItem('shoppingData')) || initialData;
        let currentFilter = 'all';
        
        // Meal plan data
        const mealPlanData = {
            Monday: { breakfast: "Eggs & toast (GF bread)", lunch: "Leftover taco filling with rice & lettuce wraps", dinner: "Taco night: ground beef, corn tortillas, toppings" },
            Tuesday: { breakfast: "Oatmeal (certified GF) with berries & maple syrup", lunch: "Leftover rotisserie chicken, rice, veggies", dinner: "Sheet pan chicken thighs with roasted sweet potatoes & green beans" },
            Wednesday: { breakfast: "Yogurt with granola & berries", lunch: "Turkey & cheese sandwiches (GF bread), fruit", dinner: "Chicken stir-fry with asparagus, green onion, and rice" },
            Thursday: { breakfast: "Smoothies (banana, berries, yogurt, milk)", lunch: "Leftover stir-fry or soup, GF crackers", dinner: "Pasta night: GF pasta, homemade marinara, meatballs" },
            Friday: { breakfast: "Scrambled eggs, fruit, toast", lunch: "Leftover pasta or soup, GF crackers", dinner: "Blackstone steak fajitas: marinated steak, peppers, onions, tortillas" },
            Saturday: { breakfast: "Pancakes (GF mix) with berries & butter", lunch: "Picnic: cheese, deli meat, fruit, GF crackers", dinner: "Fish tacos: baked cod, avocado, cabbage slaw, lime" },
            Sunday: { breakfast: "Breakfast bake (eggs, veggies, cheese)", lunch: "Leftovers from breakfast bake, salad", dinner: "Slow cooker pulled pork, coleslaw, GF rolls" }
        };
        
        const recipes = {
            Monday: { name: "Taco Night (Blackstone or Stovetop)", time: "15 min", ingredients: "1.5 lbs ground beef, 2 tbsp taco seasoning, 1/2 cup water, corn tortillas, toppings", instructions: "Brown beef, add seasoning and water, simmer 2-3 min. Warm tortillas on Blackstone or skillet. Serve with toppings." },
            Tuesday: { name: "Sheet Pan Chicken with Sweet Potatoes & Green Beans", time: "20 min prep, 25 min bake", ingredients: "1.5 lbs chicken thighs, 2 large sweet potatoes, 1 lb green beans, 3 tbsp olive oil, garlic powder, paprika, salt & pepper", instructions: "Preheat 400°F. Toss potatoes with oil, roast 10 min. Add green beans and chicken, season. Roast 15-20 min until chicken reaches 165°F." },
            Wednesday: { name: "Chicken Stir-Fry with Asparagus & Green Onion", time: "20 min", ingredients: "1.5 lbs chicken breast (sliced), 1 bunch asparagus, 4-5 green onions, 3 cloves garlic, 2 tbsp tamari, 1 tbsp sesame oil, olive oil, cornstarch", instructions: "Toss chicken with cornstarch. Cook in hot oil 5-6 min, set aside. Stir-fry asparagus & onions 4-5 min. Return chicken, add garlic, sauces. Toss 1-2 min. Serve over rice." },
            Thursday: { name: "GF Pasta with Marinara & Meatballs", time: "25 min", ingredients: "1 lb ground beef, 1/2 cup GF breadcrumbs, 1 egg, 1/4 cup parmesan, 2 cloves garlic, Italian seasoning, salt & pepper, marinara sauce, GF pasta", instructions: "Cook pasta. Mix beef, breadcrumbs, egg, parmesan, garlic, seasoning. Form meatballs. Brown 8-10 min. Add sauce, simmer 5-10 min. Toss with pasta." },
            Friday: { name: "Blackstone Steak Fajitas (No Sesame)", time: "15 min active + 15 min marinade", ingredients: "1.5 lbs sirloin steak (sliced), 3 bell peppers, 2 large onions, 3 tbsp olive oil, 3 cloves garlic, 2 tbsp lime juice, cumin, paprika, tortillas, toppings", instructions: "Marinate steak 15 min. Preheat Blackstone. Cook peppers & onions 8-10 min. Add steak, cook 5-7 min. Combine, toss 1-2 min. Warm tortillas on griddle. Serve with toppings." },
            Saturday: { name: "Fish Tacos with Lime Slaw", time: "25 min", ingredients: "1.5 lbs cod, paprika, cumin, olive oil, cabbage, 2 limes, corn tortillas, avocados, cilantro", instructions: "Make slaw with cabbage, lime juice, oil. Season fish with paprika & cumin. Cook in oil 4-5 min per side. Warm tortillas. Assemble with slaw, fish, avocado, cilantro." },
            Sunday: { name: "Slow Cooker Pulled Pork", time: "10 min prep, 6-8 hours slow cook", ingredients: "4-5 lb pork shoulder, 1 large onion, 1/2 cup apple cider vinegar, 1/4 cup brown sugar, Worcestershire sauce, paprika, garlic powder, salt & pepper, broth, GF rolls, coleslaw", instructions: "Place onions in slow cooker. Rub pork with spices. Place on onions. Mix vinegar, sugar, Worcestershire, broth. Pour over. Cook LOW 6-8 hours until shreds easily. Serve on rolls with coleslaw." }
        };
        
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
            
            if (tabName === 'meals') renderMealPlan();
            if (tabName === 'recipes') renderRecipes();
            if (tabName === 'prep') renderPrepTips();
        }
        
        function addItem() {
            const input = document.getElementById('newItemInput');
            const section = document.getElementById('sectionSelect').value;
            if (input.value.trim()) {
                if (!shoppingData[section]) shoppingData[section] = [];
                shoppingData[section].push({ name: input.value.trim(), checked: false });
                saveData();
                renderShoppingList();
                input.value = '';
            }
        }
        
        function filterSection(section) {
            currentFilter = section;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderShoppingList();
        }
        
        function toggleItem(section, idx) {
            shoppingData[section][idx].checked = !shoppingData[section][idx].checked;
            saveData();
            renderShoppingList();
        }
        
        function deleteItem(section, idx) {
            shoppingData[section].splice(idx, 1);
            saveData();
            renderShoppingList();
        }
        
        function renderShoppingList() {
            let html = '';
            let totalItems = 0;
            let checkedItems = 0;
            
            Object.entries(shoppingData).forEach(([section, items]) => {
                const filtered = currentFilter === 'all' || currentFilter === section;
                if (!filtered) return;
                
                html += `<div class="shopping-section">
                    <div class="section-title">${section}</div>`;
                
                items.forEach((item, idx) => {
                    totalItems++;
                    if (item.checked) checkedItems++;
                    html += `
                        <div class="shopping-item ${item.checked ? 'checked' : ''}">
                            <input type="checkbox" ${item.checked ? 'checked' : ''} onchange="toggleItem('${section}', ${idx})" />
                            <label>${item.name}</label>
                            <button class="delete-btn" onclick="deleteItem('${section}', ${idx})">×</button>
                        </div>
                    `;
                });
                html += '</div>';
            });
            
            const percent = totalItems > 0 ? Math.round((checkedItems / totalItems) * 100) : 0;
            document.getElementById('stats').innerHTML = `✓ ${checkedItems} of ${totalItems} items (${percent}%)`;
            document.getElementById('shoppingList').innerHTML = html || '<div class="empty-state"><p>No items found</p></div>';
        }
        
        function renderMealPlan() {
            let html = '';
            Object.entries(mealPlanData).forEach(([day, meals]) => {
                html += `
                    <div class="meal-day">
                        <h3>${day}</h3>
                        <div class="meal-type"><strong>Breakfast:</strong> <p>${meals.breakfast}</p></div>
                        <div class="meal-type"><strong>Lunch:</strong> <p>${meals.lunch}</p></div>
                        <div class="meal-type"><strong>Dinner:</strong> <p>${meals.dinner}</p></div>
                    </div>
                `;
            });
            document.getElementById('mealPlanContent').innerHTML = html;
        }
        
        function renderRecipes() {
            let html = '';
            Object.entries(recipes).forEach(([day, recipe]) => {
                html += `
                    <div class="recipe-day">
                        <h3 onclick="this.nextElementSibling.classList.toggle('open')">
                            <span>${day}: ${recipe.name}</span>
                            <span>▼</span>
                        </h3>
                        <div class="recipe-content">
                            <strong>⏱️ Time:</strong> ${recipe.time}<br>
                            <strong>🥘 Ingredients:</strong> ${recipe.ingredients}<br>
                            <strong>👨‍🍳 Instructions:</strong> ${recipe.instructions}
                        </div>
                    </div>
                `;
            });
            document.getElementById('recipesContent').innerHTML = html;
        }
        
        function renderPrepTips() {
            const tips = `
                <div class="prep-tips-section">
                    <h3>🍳 Sunday Prep (30-45 min)</h3>
                    <p>• Roast chicken for the week</p>
                    <p>• Make breakfast bake (2 batches)</p>
                    <p>• Prep vegetables: chop onions, peppers, carrots</p>
                    <p>• Cook rice in bulk (3 cups)</p>
                </div>
                
                <div class="prep-tips-section">
                    <h3>🍲 Batch Cooking Ideas</h3>
                    <p>• Marinara sauce: make double batch, use Wed + Fri</p>
                    <p>• Ground beef: brown 2 lbs, use for tacos & pasta</p>
                    <p>• Slow cooker pulled pork: set Saturday morning</p>
                    <p>• Rice: cook 3 cups for the week</p>
                </div>
                
                <div class="prep-tips-section">
                    <h3>⏱️ Quick Night Strategy</h3>
                    <p>• Blackstone meals = 1 griddle to clean (Mon & Fri)</p>
                    <p>• Use pre-cut veggies from Sunday prep</p>
                    <p>• Sheet pan meals = 1 pan to clean</p>
                    <p>• Get Andrew & Ben involved!</p>
                </div>
                
                <div class="prep-tips-section">
                    <h3>✅ Wheat-Free Notes</h3>
                    <p>• GF pasta: Barilla or Banza</p>
                    <p>• Soy sauce: Use tamari (wheat-free)</p>
                    <p>• Check labels on marinara sauces</p>
                    <p>• Rice, corn, potatoes are naturally wheat-free</p>
                </div>
            `;
            document.getElementById('prepContent').innerHTML = tips;
        }
        
        function saveData() {
            localStorage.setItem('shoppingData', JSON.stringify(shoppingData));
        }
        
        // Initialize
        window.onload = function() {
            renderShoppingList();
        };
    </script>
</body>
</html>
